# GitHub-hosted CI can validate the committed source, not the retail oracle.
# Byte-identical builds require separately provisioned retail baselines and
# the exact historical compiler / assembler environment (docs/CI.md).
name: CI (source-only)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trailing whitespace in tracked code
        run: |
          # Markdown deliberately permits trailing spaces for hard breaks.
          if git grep -InE ' +$' -- '*.c' '*.h' '*.inc' '*.py' '*.yaml'; then
            echo "::error::trailing whitespace found"
            exit 1
          fi
      - name: Merge-conflict markers
        run: |
          if git grep -InE '^(<<<<<<<|>>>>>>>)( |$)' -- .; then
            echo "::error::conflict markers found"
            exit 1
          fi
      - name: Python syntax (tools, scripts, tests)
        run: python3 -m compileall -q tools scripts tests

  unit-tests:
    name: Offline Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install PyYAML==6.0.3 capstone==5.0.7
      - name: Discover and run tests
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          count = suite.countTestCases()
          print(f"Discovered {count} unit tests", flush=True)
          if count < 200:
              raise SystemExit("Test discovery returned too few tests (expected at least 200)")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  ratchets:
    name: Placeholder/debt ratchets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce ratchet baselines
        run: python3 tools/check_ratchets.py

  progress:
    name: Function census (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Measure committed source
        run: |
          python3 tools/progress.py --json > progress.json
          cat progress.json
      - uses: actions/upload-artifact@v7
        with:
          name: progress-report
          path: progress.json
          if-no-files-found: error
